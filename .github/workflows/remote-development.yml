name: Remote development
on:
  push:
    branches: [feat/remote-development]
  pull_request:
    paths:
      - hermes_cli/subcommands/remote*.py
      - hermes_cli/_startup_fast.py
      - hermes_cli/main.py
      - tests/hermes_cli/test_remote*.py
      - tests/hermes_cli/remote_ssh/**
      - .github/workflows/remote-development.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.0.2
      - name: Standalone launcher contracts (no local Hermes dependencies)
        shell: bash
        run: |
          export HERMES_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          bash scripts/run_tests.sh tests/hermes_cli/test_remote_dev.py -- --confcutdir=tests/hermes_cli -o addopts= -q
      - name: Real SSH and tmux container, fixture agents
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export HERMES_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          bash scripts/run_tests.sh tests/hermes_cli/test_remote_ssh_integration.py -- --confcutdir=tests/hermes_cli -o addopts= -m integration -q
